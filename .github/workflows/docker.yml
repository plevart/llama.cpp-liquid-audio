# Build and publish llama-server images (CUDA 12 / Intel SYCL / Vulkan)
# to ghcr.io/plevart/llama.cpp-liquid-audio:server-<variant>-bX
#
# Triggered by:
#   - pushing a tag named b<integer> (e.g. b1, b2, ... b1234), which follows the
#     upstream llama.cpp release convention (letter "b" + positive decimal integer).
#     The tag name becomes the image version suffix (server-<variant>-<tag>).
#   - manual dispatch (workflow_dispatch) as a fallback; in that case the version is
#     computed using the upstream convention: "b" + git commit count.

name: Build and push server images

on:
  workflow_dispatch:
  push:
    tags:
      - 'b[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: server-${{ matrix.config.tag }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config:
          - tag: cuda12
            dockerfile: .devops/cuda.Dockerfile
            build_args: |
              UBUNTU_VERSION=22.04
              CUDA_VERSION=12.4.0
            free_disk_space: true
          - tag: intel
            dockerfile: .devops/intel.Dockerfile
            build_args: |
              ONEAPI_VERSION=2025.2.2-0-devel-ubuntu24.04
              GGML_SYCL_F16=OFF
            free_disk_space: true
          - tag: vulkan
            dockerfile: .devops/vulkan.Dockerfile
            build_args: |
              UBUNTU_VERSION=26.04
            free_disk_space: false

    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # preserve full history, needed to compute the build number on manual dispatch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        if: ${{ matrix.config.free_disk_space == true }}
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Determine image version (bX)
        id: tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # tag push: use the tag itself (b1, b2, ...)
            IMG_TAG="${{ github.ref_name }}"
          else
            # manual dispatch: upstream llama.cpp convention = "b" + commit count
            BUILD_NUMBER="$(git rev-list --count HEAD)"
            IMG_TAG="b${BUILD_NUMBER}"
          fi
          echo "name=${IMG_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image version: ${IMG_TAG}"

      - name: Extract metadata (labels + tags)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/plevart/llama.cpp-liquid-audio
          tags: |
            type=raw,value=server-${{ matrix.config.tag }}-${{ steps.tag.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/plevart/llama.cpp-liquid-audio
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=llama-server (${{ matrix.config.tag }})

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.config.dockerfile }}
          target: server
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.config.build_args }}
          # registry-based cache (no storage limit), keyed per variant
          cache-from: type=registry,ref=ghcr.io/plevart/llama.cpp-liquid-audio:buildcache-${{ matrix.config.tag }}
          cache-to: type=registry,ref=ghcr.io/plevart/llama.cpp-liquid-audio:buildcache-${{ matrix.config.tag }},mode=max
